services:
  postgres:
    image: postgres:16
    container_name: admin_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: admin_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis-dev:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
