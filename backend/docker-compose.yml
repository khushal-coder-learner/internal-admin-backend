services:

  db:
    image: postgres:15
    container_name: admin_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin_db

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin_db"]
      interval: 30s
      timeout: 3s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: admin_redis
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: admin_api

    depends_on:
      db:
        condition: service_healthy
      redis: 
        condition: service_healthy
      init:
        condition: service_completed_successfully

    ports:
      - "8000:8000"

    env_file:
      - .env

    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

    healthcheck:
      test: >
        bash -c "
        curl -f http://localhost:8000/health/db &&
        curl -f http://localhost:8000/health/redis
        "
      interval: 30s
      timeout: 3s
      retries: 5

    restart: unless-stopped

  init:
    build: .
    container_name: admin_init

    depends_on:
      db: 
        condition: service_healthy
      redis: 
        condition: service_healthy

    env_file:
      - .env

    command: >
      bash -c "
      echo $DATABASE_URL &&
      sleep 5 &&
      alembic upgrade head &&
      python -m scripts.create_admin &&
      python -m scripts.seed_users &&
      echo 'Init done'
      "

    restart: "no"

  worker:
    build: .
    container_name: admin_worker

    depends_on:
      db:
        condition: service_healthy
      redis: 
        condition: service_healthy
      init:
        condition: service_completed_successfully

    env_file:
      - .env

    command: python -m app.worker.worker

    restart: unless-stopped

volumes:
  postgres_data: